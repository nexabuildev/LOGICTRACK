spring.application.name=backend

# ==============================================================
# CONFIGURACIÓN DEL SERVIDOR
# ==============================================================
# Puerto donde se levantará nuestra API (Backend)
server.port=8080

# ==============================================================
# CONEXIÓN A LA BASE DE DATOS (PostgreSQL en Docker)
# ==============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5455/logictrack_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:4565}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================================
# Muestra las consultas SQL en la terminal (muy útil para debuggear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 'update' creará las tablas automáticamente en esta fase de desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# CONFIGURACIÓN DE CORREO (SMTP MailHog en Docker)
# ==============================================================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false